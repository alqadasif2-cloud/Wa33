name: Build Android APK (TRUST WALLET PRO)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Standalone Offline APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies & Compile Assets
        run: |
          echo "Verifying environment and configuration..."
          if [ ! -f "firebase-applet-config.json" ]; then
            echo "Creating fallback firebase configuration for build..."
            echo '{"projectId":"placeholder","appId":"1:0:web:0","apiKey":"dummy","authDomain":"placeholder.firebaseapp.com","firestoreDatabaseId":"(default)"}' > firebase-applet-config.json
          fi

          echo "Compiling React SPA into standalone offline assets..."
          npm install --legacy-peer-deps
          npm run build

          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/dist
          cp -r dist app/src/main/assets/
          echo "Verifying bundled assets:"
          ls -la app/src/main/assets/dist

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          echo "Configuring Android SDK licenses..."
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a256e3e553d9730858474adc4ee\n" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          printf "\n84831b9409646a256e3e553d9730858474adc4ee\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          fi

      - name: Build Standalone Debug APK
        run: |
          echo "Compiling Android APK with embedded offline assets..."
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        run: |
          echo "Searching for generated APK file..."
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "=================================================="
            echo "SUCCESS: Standalone APK Generated at $APK_FILE"
            ls -lh "$APK_FILE"
            echo "=================================================="
          else
            echo "ERROR: No APK was generated in app/build/outputs/apk"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TRUST-WALLET-PRO-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
